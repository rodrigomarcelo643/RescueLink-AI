<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RescueLink AI</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RescueLink AI" />
    <meta name="theme-color" content="#581c87" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/src/index.css" rel="stylesheet">
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        if (window.onPWAInstallPromptReady) {
          window.onPWAInstallPromptReady(e);
        }
      });

      // 🚀 Auto-request Location & Notification permissions on PWA startup
      window.addEventListener('DOMContentLoaded', () => {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              try {
                localStorage.setItem('rescuelink_user_gps', JSON.stringify({
                  lat: pos.coords.latitude,
                  lng: pos.coords.longitude,
                  time: Date.now()
                }));
              } catch(e) {}
            },
            () => {},
            { enableHighAccuracy: true, timeout: 8000 }
          );
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err)
          })
        })
      }
    </script>
  </body>
</html>
